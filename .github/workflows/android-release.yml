name: Android Release APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'organic-lab---3d-exam-simulator.zip'
      - '.github/workflows/android-release.yml'

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract Android project
        shell: bash
        run: |
          rm -rf build-src
          mkdir build-src
          unzip -q organic-lab---3d-exam-simulator.zip -d build-src
          test -f build-src/settings.gradle.kts
          test -f build-src/app/build.gradle.kts

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate temporary release keystore
        working-directory: build-src
        shell: bash
        run: |
          keytool -genkeypair -v \
            -keystore my-upload-key.jks \
            -storepass android \
            -keypass android \
            -alias upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Organic Lab Release, OU=Build, O=Organic Lab, L=Cairo, ST=Cairo, C=EG"

      - name: Build release APK
        working-directory: build-src
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/build-src/my-upload-key.jks
          STORE_PASSWORD: android
          KEY_PASSWORD: android
        run: |
          gradle --version
          gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify APK
        working-directory: build-src
        shell: bash
        run: |
          ls -lh app/build/outputs/apk/release/
          test -f app/build/outputs/apk/release/app-release.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: organic-lab-release-apk
          path: build-src/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
